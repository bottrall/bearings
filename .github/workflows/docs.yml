name: docs

on:
  workflow_dispatch: # redeploys between releases
  workflow_call: # release.yml, after each release

permissions:
  contents: read

jobs:
  # Building runs the dev bundle, so it happens here, without a write token,
  # and hands deploy the built site.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bin/docs
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
          if-no-files-found: error

  # Holds the write token, so it runs none of the bundle: it only pushes the
  # built site.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The deploy action works on a checkout and brings its own token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      # Without it GitHub Pages runs Jekyll, which turns the .md copies into HTML.
      - run: touch _site/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: _site
